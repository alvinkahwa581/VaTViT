
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaTViT | Global Trading Terminal</title>
    <!-- Include Tailwind CSS if you use it, or your own styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #05070d;
            --panel: rgba(16, 22, 34, 0.82);
            --panel-strong: rgba(9, 14, 22, 0.96);
            --gold: #d4af37;
            --gold-soft: #f3d77a;
            --green: #0ea76a;
            --text: #edf3ff;
            --muted: #b4c0d5;
            --line: rgba(212, 175, 55, 0.35);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: radial-gradient(circle at top, #0d1320, var(--bg) 40%);
            color: var(--text);
            font-family: "Segoe UI", "Poppins", "Arial", sans-serif;
        }

        body {
            background-color: #000;
            color: white;
            overflow-x: hidden;
        }

        .vatvit-dev-banner {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(90deg, rgba(10, 26, 20, 0.96), rgba(23, 17, 10, 0.96));
            border-bottom: 1px solid var(--line);
            box-shadow: 0 10px 30px rgba(0,0,0,0.28);
        }

        .vatvit-dev-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            text-align: center;
        }

        .vatvit-dev-pill {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.14);
            border: 1px solid rgba(212, 175, 55, 0.6);
            color: var(--gold-soft);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .vatvit-dev-copy {
            color: var(--text);
            font-size: 0.96rem;
            line-height: 1.5;
            font-weight: 500;
        }

        .vatvit-dev-copy strong {
            color: var(--gold-soft);
            font-weight: 700;
        }

        #root {
            min-height: 70vh;
        }

        .vatvit-footer {
            background: rgba(8, 12, 18, 0.96);
            border-top: 1px solid var(--line);
            padding: 22px 20px 28px;
            color: var(--muted);
            text-align: center;
            font-size: 0.9rem;
        }

        .vatvit-footer-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .vatvit-footer a {
            color: var(--gold-soft);
            text-decoration: none;
        }

        /* Custom scrollbar for a pro feel */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="vatvit-dev-banner">
        <div class="vatvit-dev-inner">
            <span class="vatvit-dev-pill">Under Development</span>
            <div class="vatvit-dev-copy"><strong>Thank you for your patience.</strong> This platform is currently being worked on by the VaTViT team.</div>
        </div>
    </div>

    <div id="root">
        <!-- The Dashboard Final Fixer will inject the Sidebar and Charts here automatically -->
    </div>

    <footer class="vatvit-footer">
        <div class="vatvit-footer-inner">
            <div>For enquiries and suggestions, contact <a href="tel:0724862593">0724862593</a>.</div>
            <div>By Chief Development Officer ALVIN KAHWAI and Tester IAN GITONGA.</div>
        </div>
    </footer>

    <!-- 1. The main logic file we created -->
    <script src="vatvit_dashboard_final_fixer.js"></script>
    
    <!-- 2. The TradingView library (required for charts) -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</body>
</html>
